<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!--
    Explicit favicon links. public/favicon.ico was a 1024x1024 PNG (1.4MB,
    mislabeled with a .ico extension) — loaded on every single page load
    sitewide since browsers request /favicon.ico by default even with no
    <link rel="icon"> present. Confirmed via a live Lighthouse audit (Aug
    2026) as the single largest byte-weight item on the homepage, bigger
    than every JS bundle combined. Replaced with a properly-sized set
    (32x32 down to ~2KB) and referenced explicitly here so browsers use
    these instead of guessing at /favicon.ico.
  -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!--
    Preconnect to the origins the LCP element (hero text/image) depends on
    on almost every page — the heading/body font (Google Fonts) and the
    ImageKit CDN serving nearly every real content image. Establishing the
    DNS/TLS connection early, in parallel with everything else the preload
    scanner discovers, avoids that connection setup cost landing entirely
    after those requests are actually issued.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://ik.imagekit.io" />

  <!--
    Font stylesheet still discovered immediately from the raw HTML via the
    preload scanner (not left to a CSS @import, which would wait on the
    bundled stylesheet first — see the critical-CSS setup in
    scripts/prerender.mjs) — but no longer a plain <link rel="stylesheet">.
    Verified Beasties (preload: "swap" in prerender.mjs) does NOT touch this
    external/cross-origin link — its critical-CSS pass only rewrites the
    app's own same-origin bundle — so this was genuinely render-blocking on
    every single page (avg. 1,262ms of mobile render-blocking cost sitewide,
    Aug 2026 PageSpeed audit) with nothing downstream fixing it.

    Standard preload+onload-swap pattern below: rel="preload" fetches it in
    parallel at high priority without blocking first paint; media="print"
    keeps the <link rel="stylesheet"> copy non-render-blocking until its
    onload fires and flips media to "all". (A prerendered snapshot of this
    page will show media="all" already, since Puppeteer waits for the page
    to finish loading — including this onload firing — before capturing;
    that's the correct post-load state, not a sign the trick didn't work.)
    font-display=swap (in the URL) means text paints with the fallback font
    regardless, so there's no FOIT either way. <noscript> covers the no-JS
    case, where onload never fires.

    Weights trimmed to what's actually used (grepped every font-* class and
    inline fontWeight in src/): Inter keeps 300 (2 real font-light uses,
    both on body/Inter elements) through 700; Poppins drops both 300 (no
    heading uses font-light) and 800 (font-extrabold isn't used anywhere).
    font-black (900) was already unrepresented in the old weight list too —
    left that as-is rather than adding a new weight file, since that would
    be a visual change (thicker text) beyond just trimming unused ones.
  -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" />
  </noscript>

  <!--
    Google Tag Manager — deferred until the visitor's first interaction
    (or a capped fallback timer) so it can't compete with the LCP-critical
    hero for network/main-thread time, AND gated on the "analytics" cookie
    category actually being consented to (not merely "not yet rejected") —
    CookieBanner.tsx calls window.__sriaOnConsent with the visitor's choice
    once they accept/reject/save preferences, which is what starts the
    timers below for a first-time visitor. If analytics was already
    accepted on a prior visit, the timers arm immediately on this load.
    GA4 is configured as a tag inside this GTM container, so this is the
    single, non-duplicate analytics entry point for the site.
  -->
  <script>
    (function () {
      // Set by scripts/prerender.mjs before the app loads: the prerender
      // pass sits on each page long enough for these deferred timers to
      // fire for real, which would bake an already-loaded GTM (and whatever
      // it injects in turn) into the static HTML. Skip entirely — a
      // prerendering headless browser has no visitor to analyze anyway.
      if (window.__PRERENDERING__) return;

      var GTM_ID = 'GTM-NGJZXX9M';
      var loaded = false;
      var listenersArmed = false;
      var events = ['scroll', 'keydown', 'click', 'touchstart', 'mousemove'];
      var fallback;

      function loadGTM(evt) {
        // isTrusted excludes programmatic events (e.g. this app's own
        // window.scrollTo() on route change synthesizes a "scroll" event)
        // so only a genuine user gesture — or the fallback timer — counts.
        if (evt && !evt.isTrusted) return;
        if (loaded) return;
        loaded = true;
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
        var f = document.getElementsByTagName('script')[0];
        var j = document.createElement('script');
        j.async = true;
        j.src = 'https://www.googletagmanager.com/gtm.js?id=' + GTM_ID;
        f.parentNode.insertBefore(j, f);
        events.forEach(function (evt) { window.removeEventListener(evt, loadGTM); });
        clearTimeout(fallback);
      }

      function armGTM() {
        if (listenersArmed || loaded) return;
        listenersArmed = true;
        events.forEach(function (evt) { window.addEventListener(evt, loadGTM, { passive: true, once: true }); });
        fallback = setTimeout(loadGTM, 5000);
      }

      var consent = null;
      try { consent = JSON.parse(localStorage.getItem('sria_cookie_consent')); } catch (e) {}
      if (consent && consent.prefs && consent.prefs.analytics) armGTM();

      window.__sriaOnConsent = window.__sriaOnConsent || [];
      window.__sriaOnConsent.push(function (prefs) {
        if (prefs.analytics) armGTM();
      });
    })();
  </script>
  <!-- End Google Tag Manager -->

  <!--
    Google Analytics 4 (gtag.js) — added directly rather than relying on a
    GA4 tag inside the GTM container above: a live audit (Aug 2026)
    confirmed no gtag/GA4 request was firing on the deployed site at all,
    so whatever was assumed to be configured inside GTM either isn't there
    or isn't reachable — this is now the actual, verified analytics entry
    point. NOTE: if a GA4 tag is later added inside the GTM container too,
    remove one of the two — running both at once double-counts every
    pageview/event.

    Same deferral + consent-gating as GTM above (first genuine interaction
    or a capped fallback timer; gated on the "analytics" cookie category).
    send_page_view is explicitly disabled on config — because loading is
    deferred, gtag's own automatic initial pageview would fire late/against
    a possibly-stale path. Instead this fires one page_view explicitly the
    moment GA finishes loading (for whatever route the visitor is actually
    on then), and RouteSeo.tsx (mounted once near the router root, outside
    Suspense) fires one on every subsequent client-side route change —
    together these cover every pageview a real SPA visitor generates,
    with none doubled and none missed before consent.

    VITE_GA_MEASUREMENT_ID is a build-time env var (see Frontend/.env) —
    PLACEHOLDER, left unset until a real GA4 property exists. Vite replaces
    %VITE_GA_MEASUREMENT_ID% in this static HTML file at build time; when
    unset it's replaced with an empty string, so the guard below skips
    loading entirely rather than sending a broken request.
  -->
  <script>
    (function () {
      if (window.__PRERENDERING__) return;

      var GA_ID = '%VITE_GA_MEASUREMENT_ID%';
      if (!GA_ID || GA_ID.indexOf('%') !== -1) return;

      var loaded = false;
      var listenersArmed = false;
      var events = ['scroll', 'keydown', 'click', 'touchstart', 'mousemove'];
      var fallback;

      function loadGA(evt) {
        if (evt && !evt.isTrusted) return;
        if (loaded) return;
        loaded = true;

        window.dataLayer = window.dataLayer || [];
        window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
        var j = document.createElement('script');
        j.async = true;
        j.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
        document.head.appendChild(j);

        window.gtag('js', new Date());
        window.gtag('config', GA_ID, { send_page_view: false });
        window.gtag('event', 'page_view', {
          page_path: window.location.pathname + window.location.search,
          page_title: document.title,
        });

        events.forEach(function (evt) { window.removeEventListener(evt, loadGA); });
        clearTimeout(fallback);
      }

      function armGA() {
        if (listenersArmed || loaded) return;
        listenersArmed = true;
        events.forEach(function (evt) { window.addEventListener(evt, loadGA, { passive: true, once: true }); });
        fallback = setTimeout(loadGA, 5000);
      }

      var consent = null;
      try { consent = JSON.parse(localStorage.getItem('sria_cookie_consent')); } catch (e) {}
      if (consent && consent.prefs && consent.prefs.analytics) armGA();

      window.__sriaOnConsent = window.__sriaOnConsent || [];
      window.__sriaOnConsent.push(function (prefs) {
        if (prefs.analytics) armGA();
      });
    })();
  </script>
  <!-- End Google Analytics 4 -->

  <!--
    Intentionally no static <title>, <meta name="description">,
    <link rel="canonical">, or Open Graph/Twitter tags here.

    RouteSeo (src/components/seo/RouteSeo.tsx) renders all of those via
    react-helmet-async for every route, including this generic fallback
    for "/". react-helmet-async cannot remove tags it didn't create, so a
    static duplicate here would survive alongside Helmet's version in the
    prerendered HTML instead of being replaced by it — every crawler
    would see two conflicting <title>/<link rel="canonical"> tags. Real
    users and Googlebot only ever see the Helmet-managed version anyway,
    since every indexable route is prerendered to static HTML at build
    time (see scripts/prerender.mjs).
  -->

  <!-- Author -->
  <meta name="author" content="Sria Infotech" />

  <!--
    Google Search Console — "HTML tag" verification method. PLACEHOLDER:
    replace the content value below with the real one Search Console shows
    when the property is created, or delete this tag entirely if the
    HTML-file verification method (a static file dropped in public/,
    served at the site root by Vite) is used instead. Not Helmet-managed
    (react-helmet-async only owns title/description/canonical/OG/Twitter
    tags per RouteSeo.tsx) so this is safe to hand-write here once,
    site-wide — same reasoning as the Organization JSON-LD block below.
  -->
  <meta name="google-site-verification" content="REPLACE_WITH_REAL_SEARCH_CONSOLE_VERIFICATION_VALUE" />

</head>
