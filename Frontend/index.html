  <!--
    Intentionally no static <title>, <meta name="description">,
    <link rel="canonical">, or Open Graph/Twitter tags here.

    RouteSeo (src/components/seo/RouteSeo.tsx) renders all of those via
    react-helmet-async for every route, including this generic fallback
    for "/". react-helmet-async cannot remove tags it didn't create, so a
    static duplicate here would survive alongside Helmet's version in the
    prerendered HTML instead of being replaced by it — every crawler
    would see two conflicting <title>/<link rel="canonical"> tags. Real
    users and Googlebot only ever see the Helmet-managed version anyway,
    since every indexable route is prerendered to static HTML at build
    time (see scripts/prerender.mjs).
  -->
